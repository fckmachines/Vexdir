name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            binary: build/vexdir
            filename: vexdir
          - os: windows-2022
            platform: windows-x64
            binary: build/Release/vexdir.exe
            filename: vexdir.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vexdir-${{ matrix.platform }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vexdir-*
          path: dist
          merge-multiple: true
      - name: Publish standalone executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/vexdir
          test -s dist/vexdir.exe
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 dist/vexdir dist/vexdir.exe --clobber
          else
            gh release create v0.1.0 dist/vexdir dist/vexdir.exe \
              --title "Vexdir 0.1.0" \
              --notes "Read-only, single-pane C++17 terminal navigator. Standalone Linux x64 and Windows x64 binaries." \
              --target "${GITHUB_SHA}"
          fi
          for name in vexdir-linux-x64.zip vexdir-windows-x64.zip; do
            id=$(gh api "repos/${GH_REPO}/releases/tags/v0.1.0" --jq ".assets[] | select(.name == \"$name\") | .id")
            if [[ -n "$id" ]]; then
              gh api --method DELETE "repos/${GH_REPO}/releases/assets/$id"
            fi
          done
